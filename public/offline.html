<!doctype html>
<html lang="vi" style="background-color:#291507;color:#f5f5f4;width:100%;height:100%;margin:0;padding:0;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Loạn 12 Sứ Quân — Chế Độ Ngoại Tuyến</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background-color: #291507;
        background-image: radial-gradient(circle at 50% 45%, rgba(245,158,11,0.22) 0%, transparent 70%),
                          linear-gradient(180deg, #361a07 0%, #251206 55%, #3b1d09 100%);
        color: #f5f5f4;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 20px;
        text-align: center;
      }
      .card {
        background: rgba(35, 17, 7, 0.95);
        border: 2px solid #d97706;
        border-radius: 16px;
        padding: 28px 24px;
        max-width: 360px;
        width: 100%;
        box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      }
      .badge {
        display: inline-block;
        padding: 4px 12px;
        background: #78350f;
        border: 1px solid #f59e0b;
        color: #fef08a;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 1px;
        border-radius: 999px;
        margin-bottom: 14px;
        text-transform: uppercase;
      }
      h1 {
        font-size: 20px;
        font-weight: 900;
        color: #fef08a;
        margin-bottom: 8px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      p {
        font-size: 13px;
        color: #d6d3d1;
        line-height: 1.5;
        margin-bottom: 20px;
      }
      button {
        display: block;
        width: 100%;
        padding: 12px;
        background: linear-gradient(90deg, #f59e0b, #eab308, #f59e0b);
        color: #1c1917;
        font-weight: 900;
        font-size: 13px;
        border: 1px solid #fef08a;
        border-radius: 10px;
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        box-shadow: 0 4px 12px rgba(245, 158, 11, 0.4);
      }
      button:active {
        transform: scale(0.98);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">⚔️ Chế độ Ngoại Tuyến</div>
      <h1>Loạn 12 Sứ Quân</h1>
      <p>Ứng dụng đang hoạt động ở chế độ Offline. Toàn bộ tiến trình và nhân vật đã được lưu an toàn trong máy.</p>
      <button onclick="window.location.href='./'">VÀO GAME NGAY</button>
    </div>
  </body>
</html>
